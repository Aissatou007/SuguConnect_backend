spring.application.name=SuguConnect

# Configuration de la base de données MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/suguConnectDB?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root2025@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuration du serveur
server.servlet.context-path=/suguconnect
server.port=8080

# Configuration de l'administrateur par défaut
admin.nom=Super
admin.prenom=Admin
admin.email=admin@suguconnect.com
admin.telephone=70000000
admin.password=admin123

# Configuration Spring
spring.main.allow-bean-definition-overriding=true

# Configuration Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# Configuration du stockage de fichiers
file.upload-dir=./uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

