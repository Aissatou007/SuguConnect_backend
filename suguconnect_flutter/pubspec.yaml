name: suguconnect_flutter
description: Client Flutter pour l'API SuguConnect
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & Networking
  http: ^1.1.0
  dio: ^5.4.0
  
  # JSON Serialization
  json_annotation: ^4.8.1
  
  # Storage
  shared_preferences: ^2.2.2
  
  # State Management (optionnel - vous pouvez utiliser votre préféré)
  provider: ^6.1.1
  
  # File handling
  file_picker: ^6.1.0
  image_picker: ^1.0.7
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

